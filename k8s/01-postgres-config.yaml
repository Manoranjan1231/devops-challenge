apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: devops-challenge
data:
  POSTGRES_DB: appdb
  POSTGRES_USER: appuser
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: devops-challenge
type: Opaque
stringData:
  POSTGRES_PASSWORD: "SuperSecretPassword123"
---
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: devops-challenge
type: Opaque
stringData:
  # This is the "known-good" connection string. During the failure
  # simulation (scripts/break.sh) we overwrite this value with a bad
  # one to reproduce a real DB-connectivity outage, then restore it.
  DATABASE_URL: "postgresql://appuser:SuperSecretPassword123@postgres:5432/appdb"
