apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: devops-challenge
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          # Replace with your built image, e.g. ghcr.io/<you>/devops-challenge-backend:<tag>
          image: devops-challenge-backend:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: backend-secret
          env:
            - name: PORT
              value: "3000"

          # LIVENESS: "is the process alive?" Does NOT check the DB.
          # If this fails repeatedly, kubelet KILLS and RESTARTS the container.
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3

          # READINESS: "can this pod serve traffic right now?" DOES check
          # the DB. If this fails, the pod is pulled out of the Service's
          # endpoints (no restart) until it passes again.
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3

          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: devops-challenge
spec:
  selector:
    app: backend
  type: NodePort
  ports:
    - port: 80
      targetPort: 3000
      nodePort: 30080
