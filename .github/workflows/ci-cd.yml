name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-backend

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        working-directory: app
        run: npm install

      - name: Run smoke tests
        working-directory: app
        run: npm test

      - name: Set image tag
        id: meta
        run: echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: app
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Build image locally (PR validation only, no push)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: app
          push: false
          tags: local-build:${{ github.sha }}

  deploy:
    needs: build-and-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: ci-cluster

      - name: Substitute image tag into manifest
        run: |
          sed -i "s|devops-challenge-backend:local|${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-test.outputs.image_tag }}|" k8s/04-backend-deployment.yaml

      - name: Create image pull secret for GHCR
        run: |
          kubectl create namespace devops-challenge --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret docker-registry ghcr-pull-secret \
            --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GITHUB_TOKEN }} \
            -n devops-challenge --dry-run=client -o yaml | kubectl apply -f -
          kubectl patch serviceaccount default -n devops-challenge \
            -p '{"imagePullSecrets":[{"name":"ghcr-pull-secret"}]}'

      - name: Apply manifests
        run: kubectl apply -f k8s/

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/postgres -n devops-challenge --timeout=120s
          kubectl rollout status deployment/backend -n devops-challenge --timeout=120s

      - name: Smoke test the deployed service
        run: |
          kubectl port-forward -n devops-challenge svc/backend 8080:80 &
          sleep 5
          curl --fail http://localhost:8080/readyz
          curl --fail http://localhost:8080/

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          kubectl get pods -n devops-challenge -o wide
          kubectl describe pods -n devops-challenge
          kubectl logs -n devops-challenge -l app=backend --tail=100
